name: deploy
on:
  push:
    branches: [main]

concurrency:
  group: gif-sccl-deploy

jobs:
  deploy:
    if: startsWith(github.server_url, 'http://10.69.0.10') || startsWith(github.server_url, 'https://git.sccl.cc')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zine
        uses: https://github.com/kristoff-it/setup-zine@v2

      - name: Inject commit hash
        run: SHORT_SHA="${GITHUB_SHA::8}" && grep -rl COMMIT_HASH layouts content | xargs -r sed -i "s/COMMIT_HASH/${SHORT_SHA}/g"

      - name: Build
        run: zine release --force

      - name: Install rsync
        run: apt-get update && apt-get install -y rsync

      - name: Publish to /tank/sites
        run: |
          set -euo pipefail
          RELEASE="$(date -u +%Y%m%dT%H%M%S)-${GITHUB_SHA::8}"
          REL="/tank/sites/gif.sccl/releases/${RELEASE}"
          mkdir -p "${REL}"
          rsync -a --delete ./public/ "${REL}/"
          ln -sfn "releases/${RELEASE}" /tank/sites/gif.sccl/public
          ls -1 /tank/sites/gif.sccl/releases | sort | head -n -5 | xargs -r -I{} rm -rf "/tank/sites/gif.sccl/releases/{}"

  deploy-server:
    if: startsWith(github.server_url, 'http://10.69.0.10') || startsWith(github.server_url, 'https://git.sccl.cc')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install docker CLI
        run: apt-get update && apt-get install -y docker.io

      - name: Verify docker socket
        run: test -S /var/run/docker.sock && echo "docker socket ok" || { echo "docker socket missing"; exit 1; }

      - name: Build and push server image
        run: |
          set -euo pipefail
          IMG="10.69.0.17:5000/scclie/gif:main"
          docker build -t "${IMG}" ./server
          docker push "${IMG}"

      - name: Restart gifs container
        run: |
          set -euo pipefail
          docker rm -f gifs || true

  dashboards:
    if: startsWith(github.server_url, 'http://10.69.0.10') || startsWith(github.server_url, 'https://git.sccl.cc')
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Build dashboards
        run: bash scripts/build-dashboards.sh

      - name: Validate JSON
        run: ls grafana/out/*.json && python3 -m json.tool grafana/out/gif-sccl-metrics.json >/dev/null

      - name: Install rsync
        run: apt-get update && apt-get install -y rsync

      - name: Publish dashboards
        run: |
          set -euo pipefail
          DEST=/tank/mon/grafana/dashboards/gif
          mkdir -p "$DEST"
          rsync -a --delete grafana/out/ "$DEST/"
          chown -R 196:997 "$DEST"
