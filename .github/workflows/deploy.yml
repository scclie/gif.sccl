name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

env:
  CF: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}
  P: gifscclcc

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zine
        uses: kristoff-it/setup-zine@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # ── Bootstrap infra ───────────────────────────────────────
      - name: Get or create KV + D1
        id: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          KV_ID=$(curl -s "$CF/storage/kv/namespaces" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq -r '.result[] | select(.title=="SESSIONS") | .id')
          if [ -z "$KV_ID" ]; then
            KV_ID=$(curl -s -X POST "$CF/storage/kv/namespaces" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"title":"SESSIONS"}' | jq -r '.result.id')
          fi
          echo "kv=$KV_ID" >> "$GITHUB_OUTPUT"

          D1_ID=$(curl -s "$CF/d1/database" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq -r '.result[] | select(.name=="'"$P"'") | .uuid')
          if [ -z "$D1_ID" ]; then
            D1_ID=$(curl -s -X POST "$CF/d1/database" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"'"$P"'"}' | jq -r '.result.uuid')
          fi
          echo "d1=$D1_ID" >> "$GITHUB_OUTPUT"

      - name: Write wrangler config with bindings
        run: |
          printf 'name = "%s"\ncompatibility_date = "2025-04-01"\npages_build_output_dir = "public"\n\n[[kv_namespaces]]\nbinding = "SESSIONS"\nid = "%s"\n\n[[d1_databases]]\nbinding = "GIF_DB"\ndatabase_name = "%s"\ndatabase_id = "%s"\n\n[vars]\nDISCORD_REDIRECT_URI = "https://gif.sccl.cc/api/auth/callback"\nANON_RATE_LIMIT = "10"\nUSER_RATE_LIMIT = "100"\n' "${{ env.P }}" "${{ steps.infra.outputs.kv }}" "${{ env.P }}" "${{ steps.infra.outputs.d1 }}" > wrangler.toml

      - name: Run D1 migrations
        run: npx wrangler d1 migrations apply $P
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          EXISTS=$(curl -s -o /dev/null -w "%{http_code}" "$CF/pages/projects/$P" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [ "$EXISTS" = "404" ]; then
            curl -s -X POST "$CF/pages/projects" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"'"$P"'","production_branch":"main"}'
          fi

      # ── Bindings ──────────────────────────────────────────────
      - name: Set Pages project bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -s -X PATCH "$CF/pages/projects/$P" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "deployment_configs": {
                "production": {
                  "env_vars": {},
                  "kv_namespaces": {
                    "SESSIONS": {"namespace_id": "${{ steps.infra.outputs.kv }}"}
                  },
                  "d1_databases": {
                    "GIF_DB": {"database_id": "${{ steps.infra.outputs.d1 }}"}
                  }
                }
              }
            }'

      # ── Secrets ───────────────────────────────────────────────
      - name: Set secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.DISCORD_CLIENT_ID }}" | npx wrangler pages secret put DISCORD_CLIENT_ID --project-name $P
          echo "${{ secrets.DISCORD_CLIENT_SECRET }}" | npx wrangler pages secret put DISCORD_CLIENT_SECRET --project-name $P
          if [ -n "${{ secrets.CATBOX_USERHASH }}" ]; then
            echo "${{ secrets.CATBOX_USERHASH }}" | npx wrangler pages secret put CATBOX_USERHASH --project-name $P
          fi

      # ── Deploy ────────────────────────────────────────────────
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy public/ --project-name ${{ env.P }}
