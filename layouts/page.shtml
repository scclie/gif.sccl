<html lang="en">

  <link rel="canonical" :href="$page.link()">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--nord0:#2e3440;--nord1:#3b4252;--nord3:#4c566a;--nord4:#d8dee9;--nord8:#88c0d0;--nord11:#bf616a;--nord14:#a3be8c;--nord15:#b48ead;--bg:var(--nord0);--fg:var(--nord4);--fg-dim:var(--nord3)}
    html{background:var(--bg);color:var(--fg);font-family:"Space Mono",monospace;font-size:clamp(14px,1.2vw,24px);line-height:1.6;-webkit-font-smoothing:none;font-smooth:never}
    body{background:var(--bg);min-height:100vh}
    main{min-height:100vh;padding:1.875rem 1.25rem;display:flex;align-items:center;justify-content:center;position:relative;z-index:10}
    ::selection{background:var(--nord8);color:#000}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--fg-dim)}
    *:focus-visible{outline:2px solid var(--nord8);outline-offset:2px}
    .card{width:min(80vw,60rem);background:var(--nord1);padding:1.25rem;border:2px solid var(--nord8)}
    .card-header{margin-bottom:1.25rem;padding-bottom:0.9375rem;border-bottom:1px solid var(--nord8)}
    .header-info{display:flex;flex-direction:column;flex:1}
    .user{color:var(--nord8);font-size:1.25rem;font-weight:700}
    .bio{color:var(--fg);font-size:1rem}
    .card-footer{margin-top:1.25rem;padding-top:0.625rem;border-top:1px solid var(--nord8);display:flex;justify-content:space-between;align-items:center;font-size:1rem;color:var(--fg)}
    .zine-credit{color:var(--fg-dim);text-decoration:none;font-size:0.75rem}
    .zine-credit:hover{color:var(--nord8)}
    .symbol{color:var(--nord8)}
    .nav{margin-bottom:0.9375rem;padding-bottom:0.625rem;border-bottom:1px solid var(--nord8);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem}
    .nav-links{display:flex;gap:0.9375rem}
    .nav-links a{color:var(--fg);text-decoration:none;font-size:1rem;font-weight:700}
    .nav-links a:hover,.nav-links a.active{color:var(--nord8)}
    .nav-links a.active{text-decoration:underline}
    .nav-auth{display:flex;gap:0.5rem;align-items:center}
    .nav-auth .btn-small{font-size:0.75rem;padding:0.2rem 0.5rem;background:transparent;color:var(--nord8);border:1px solid var(--nord8);cursor:pointer;font-family:"Space Mono",monospace;transition:all .2s}
    .nav-auth .btn-small:hover{background:var(--nord8);color:#000}
    .nav-auth #auth-status{font-size:0.75rem;color:var(--fg-dim);display:flex;align-items:center;gap:0.35rem}
    .nav-auth #auth-status img.avatar{width:1.2rem;height:1.2rem;border-radius:50%;vertical-align:middle}
    @media(max-width:767px){html{font-size:14px}.card{width:95vw;padding:0.625rem}.card-header{text-align:center}.card-footer{font-size:0.875rem;flex-direction:column;gap:0.5rem;text-align:center}.nav{flex-direction:column;align-items:stretch;gap:0.5rem}.nav-links{justify-content:center;gap:0.5rem;flex-wrap:wrap}.nav-auth{justify-content:center}}

<body>
  <main>
    <div class="card">
      <nav class="nav">
        <div class="nav-links">
          <a href="/" class="$page.custom.get('tab').eql('home').then('active')">gif maker</a>
          <a href="/gallery/" class="$page.custom.get('tab').eql('gallery').then('active')">gallery</a>
        </div>
        <div class="nav-auth">
          <span id="auth-status" style="display:none"></span>
          <button id="btn-login" class="btn btn-small" style="display:none">[ login ]</button>
          <button id="btn-logout" class="btn btn-small" style="display:none">[ logout ]</button>
        </div>
      </nav>
      <div class="card-header">
        <div class="header-info">
          <span class="user">gif.sccl.cc</span>
          <p class="bio">minimal gif maker</p>
        </div>
      </div>
      <div class="card-content">
        <div :html="$page.content()"></div>
      </div>
      <div class="card-footer">
        <span :text="$page.custom.get('tab').suffix('.smd')"></span>
        <a href="https://zine-ssg.io" class="zine-credit" target="_blank">built with zig zine</a>
        <span class="symbol">[ctrl+c]</span>
      </div>
    </div>
  </main>

  <script>
    (function(){var a=document.getElementById('auth-status'),b=document.getElementById('btn-login'),c=document.getElementById('btn-logout');function d(){a.style.display='none';b.style.display='inline-block';c.style.display='none'}function e(u,ad){a.style.display='flex';a.innerHTML='<img class="avatar" src="https://cdn.discordapp.com/avatars/'+u.discord_id+'/'+u.avatar+'.png" alt="">'+u.username+(ad?' <span style="color:var(--nord11)">(admin)</span>':'');b.style.display='none';c.style.display='inline-block'}c.addEventListener('click',function(){fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'}).then(function(){d()}).catch(function(){d()})});b.addEventListener('click',function(){window.location.href='/api/auth/discord'});function check(){fetch('/api/auth/me',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(d){if(d.user)e(d.user,d.admin);else d()}).catch(function(){d()})}check()})();
  </script>
</body>
