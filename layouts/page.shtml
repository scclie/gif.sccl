<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title :text="$page.title"></title>
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAAcCAMAAABF0y+mAAAAAXNSR0IArs4c6QAAABhQTFRFKSkpmU41VYM2CwsL////AAAAAAAAAAAAIAoGTQAAAAh0Uk5T////////AP9gpa+mAAAASUlEQVQokWNgwwMYhp0kMwqgjyQrCiBekhkDECsJBEwogI1oSZAACwsrKwsLiCRVEsNQIiRhgoxQQLokwlCo0QQlMUMOGn54JQE/mw6R8+v/XAAAAABJRU5ErkJggg==">
  <meta name="description" :content="$page.custom.get('description')">
  <link rel="canonical" :href="$page.link()">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="gif.sccl.cc">
  <meta property="og:title" :content="$page.title">
  <meta property="og:description" :content="$page.custom.get('description')">
  <meta property="og:url" :content="$page.link()">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" :content="$page.title">
  <meta name="twitter:description" :content="$page.custom.get('description')">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--nord0:#2e3440;--nord1:#3b4252;--nord3:#4c566a;--nord4:#d8dee9;--nord8:#88c0d0;--nord11:#bf616a;--nord14:#a3be8c;--nord15:#b48ead;--bg:var(--nord0);--fg:var(--nord4);--fg-dim:var(--nord3)}
    html{background:var(--bg);color:var(--fg);font-family:"Space Mono",monospace;font-size:clamp(14px,1.2vw,24px);line-height:1.6;-webkit-font-smoothing:none;font-smooth:never}
    body{background:var(--bg);min-height:100vh}
    main{min-height:100vh;padding:1.875rem 1.25rem;display:flex;align-items:center;justify-content:center;position:relative;z-index:10}
    ::selection{background:var(--nord8);color:#000}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--fg-dim)}
    *:focus-visible{outline:2px solid var(--nord8);outline-offset:2px}
    .card{width:min(80vw,60rem);background:var(--nord1);padding:1.25rem;border:2px solid var(--nord8)}
    .card-header{margin-bottom:1.25rem;padding-bottom:0.9375rem;border-bottom:1px solid var(--nord8)}
    .header-info{display:flex;flex-direction:column;flex:1}
    .user{color:var(--nord8);font-size:1.25rem;font-weight:700}
    .bio{color:var(--fg);font-size:1rem}
    .card-footer{margin-top:1.25rem;padding-top:0.625rem;border-top:1px solid var(--nord8);display:flex;justify-content:space-between;align-items:center;font-size:1rem;color:var(--fg)}
    .zine-credit{color:var(--fg-dim);text-decoration:none;font-size:0.75rem}
    .zine-credit:hover{color:var(--nord8)}
    .symbol{color:var(--nord8)}
    .nav{margin-bottom:0.9375rem;padding-bottom:0.625rem;border-bottom:1px solid var(--nord8);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem}
    .nav-links{display:flex;gap:0.9375rem}
    .nav-links a{color:var(--fg);text-decoration:none;font-size:1rem;font-weight:700}
    .nav-links a:hover,.nav-links a.active{color:var(--nord8)}
    .nav-links a.active{text-decoration:underline}
    .nav-auth{display:flex;gap:0.5rem;align-items:center}
    .nav-auth .btn-small{font-size:0.75rem;padding:0.2rem 0.5rem;background:transparent;color:var(--nord8);border:1px solid var(--nord8);cursor:pointer;font-family:"Space Mono",monospace;transition:all .2s}
    .nav-auth .btn-small:hover{background:var(--nord8);color:#000}
    .nav-auth #auth-status{font-size:0.75rem;color:var(--fg-dim);display:flex;align-items:center;gap:0.35rem}
    .nav-auth #auth-status img.avatar{width:1.2rem;height:1.2rem;border-radius:50%;vertical-align:middle}
    @media(max-width:767px){html{font-size:14px}.card{width:95vw;padding:0.625rem}.card-header{text-align:center}.card-footer{font-size:0.875rem;flex-direction:column;gap:0.5rem;text-align:center}.nav{flex-direction:column;align-items:stretch;gap:0.5rem}.nav-links{justify-content:center;gap:0.5rem;flex-wrap:wrap}.nav-auth{justify-content:center}}

    #drop-zone{border:2px dashed var(--nord3);padding:2rem;text-align:center;cursor:pointer;margin-bottom:1rem;transition:border-color .2s}
    #drop-zone:hover,#drop-zone.drag-over{border-color:var(--nord8);background:rgba(136,192,208,.05)}
    #drop-zone .hint{color:var(--fg-dim);font-size:.875rem;margin-top:.5rem}

    .section-title{color:var(--nord8);font-size:1rem;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--nord8)}
    .section-id{color:var(--nord8);font-size:1rem;margin-bottom:.75rem}

    #trim-controls{margin-top:.75rem;padding:.75rem;background:var(--nord0);display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
    #trim-controls label{color:var(--fg);font-size:.875rem}
    #trim-controls input[type="number"]{width:4rem;background:var(--nord1);color:var(--fg);border:1px solid var(--nord3);padding:.2rem;font-family:"Space Mono",monospace;font-size:.875rem}
    .dual-range{flex:1;min-width:100px;position:relative;height:1.5rem}
    .dual-range input[type="range"]{position:absolute;top:50%;transform:translateY(-50%);width:100%;margin:0;-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;z-index:2}
    .dual-range input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--nord8);border:2px solid var(--nord0);cursor:pointer;pointer-events:auto}
    .dual-range input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--nord8);border:2px solid var(--nord0);cursor:pointer;pointer-events:auto}
    .range-track{position:absolute;top:50%;left:0;right:0;height:4px;transform:translateY(-50%);background:var(--nord3);border-radius:2px;z-index:1}
    .range-fill{height:100%;background:var(--nord8);border-radius:2px}

    .settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.75rem}
    .settings-grid label{color:var(--fg);font-size:.875rem;display:flex;flex-direction:column;gap:.25rem}
    .settings-grid input,.settings-grid select{background:var(--nord0);color:var(--fg);border:1px solid var(--nord3);padding:.35rem;font-family:"Space Mono",monospace;font-size:.875rem;width:100%}
    .settings-grid input:focus,.settings-grid select:focus{outline:none;border-color:var(--nord8)}

    .btn{background:transparent;color:var(--nord8);border:1px solid var(--nord8);padding:.4rem 1rem;cursor:pointer;font-family:"Space Mono",monospace;font-size:.875rem;transition:all .2s}
    .btn:hover{background:var(--nord8);color:#000}
    .btn:active{opacity:.7}
    .btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}

    #actions{margin-top:1rem;text-align:center}

    #progress{margin-top:1rem}
    #progress-bar{width:100%;height:6px;background:var(--nord0);margin-top:.35rem}
    #progress-fill{height:100%;width:0%;background:var(--nord8);transition:width .1s}
    #progress-fill.indet{animation:indet 1.4s ease-in-out infinite;transition:none}
    @keyframes indet{0%{width:12%;margin-left:0}50%{width:55%;margin-left:45%}100%{width:12%;margin-left:88%}}

    #result{margin-top:1rem}
    #result img{max-width:100%;max-height:400px;margin:.75rem 0;border:1px solid var(--nord3)}
    .result-actions{display:flex;gap:.5rem;margin-top:.75rem}
    #save-area{margin-top:.75rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
    #save-area label{color:var(--fg);font-size:.875rem;display:flex;align-items:center;gap:.4rem}
    #save-area input[type="checkbox"]{accent-color:var(--nord8)}
    #save-result{margin-top:.75rem}
    #save-result a{color:var(--nord8);word-break:break-all;font-size:.875rem}
    #save-result .hint{color:var(--fg-dim);font-size:.75rem;margin-top:.35rem}

    #image-list{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
    #image-list .img-thumb{width:80px;height:80px;object-fit:cover;border:1px solid var(--nord3);cursor:pointer;transition:border-color .2s}
    #image-list .img-thumb:hover{border-color:var(--nord8)}

    .error-msg{color:var(--nord11)}
    .hint{color:var(--fg-dim);font-size:.75rem;margin-top:.25rem}

    #auth-prompt{margin-top:.75rem;font-size:.75rem;color:var(--fg-dim)}
    #auth-prompt a{color:var(--nord8);cursor:pointer}
    #auth-prompt a:hover{text-decoration:underline}

    #gallery-grid,#user-gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem}
    #user-gallery-section{margin-bottom:1.5rem}
.gallery-item{border:1px solid var(--nord3);padding:.5rem;text-align:center;position:relative;display:flex;flex-direction:column}
.gallery-item img{max-width:100%;max-height:200px;display:block;margin:0 auto .5rem}
.gallery-item .gif-info{font-size:.75rem;color:var(--fg-dim);margin-bottom:.5rem}
.gallery-item .btn{font-size:.75rem;padding:.25rem .5rem}
.gallery-item .btn-row{margin-top:auto;padding-top:.5rem;display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap}
.copy-success{color:var(--nord14)!important}
.own-btn{margin:0}
.gif-tags{margin-bottom:.35rem}
    .tag{display:inline-block;font-size:.65rem;color:var(--nord14);border:1px solid var(--nord3);border-radius:3px;padding:0 .35rem;margin:0 .15rem .2rem 0}

    #crop-stage{position:relative;display:inline-block;max-width:100%;overflow:hidden}
    #crop-stage img{display:block;max-width:100%;max-height:70vh}
    #crop-box{position:absolute;top:0;left:0;right:0;bottom:0;border:2px dashed #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.5);z-index:2;pointer-events:auto}
    .crop-handle{position:absolute;width:12px;height:12px;border:2px solid #fff;background:var(--nord8);border-radius:2px}
    .crop-handle[data-edge="n"]{top:0;left:50%;transform:translate(-50%,-50%);cursor:n-resize}
    .crop-handle[data-edge="s"]{bottom:0;left:50%;transform:translate(-50%,50%);cursor:s-resize}
    .crop-handle[data-edge="w"]{top:50%;left:0;transform:translate(-50%,-50%);cursor:w-resize}
    .crop-handle[data-edge="e"]{top:50%;right:0;transform:translate(50%,-50%);cursor:e-resize}

    #gallery-loading,#gallery-empty,#gallery-error{text-align:center;padding:2rem}
    #gallery-empty a{color:var(--nord8)}
    #gallery-footer{text-align:center;margin-top:1rem;font-size:.875rem;color:var(--fg-dim)}
    #gallery-footer button{background:transparent;color:var(--nord8);border:1px solid var(--nord8);padding:.25rem .75rem;cursor:pointer;font-family:"Space Mono",monospace;font-size:.875rem;transition:all .2s}
    #gallery-footer button:hover{background:var(--nord8);color:#000}
    #gallery-footer button:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}

    .search-row{position:relative;display:flex;gap:.5rem;align-items:center;margin-bottom:.75rem}
    .search-row input{flex:1;background:var(--nord0);color:var(--fg);border:1px solid var(--nord3);padding:.35rem .5rem;font-family:"Space Mono",monospace;font-size:.875rem}
    .search-row input:focus{outline:none;border-color:var(--nord8)}
    #search-clear{background:transparent;color:var(--nord11);border:1px solid var(--nord11);padding:.35rem .6rem;cursor:pointer;font-family:"Space Mono",monospace;font-size:.875rem}
    #search-clear:hover{background:var(--nord11);color:#000}
    #search-suggestions{position:absolute;top:100%;left:0;right:0;z-index:20;background:var(--nord1);border:1px solid var(--nord3);border-top:none;max-height:200px;overflow-y:auto;text-align:left}
    #search-suggestions .sugg{display:block;width:100%;background:transparent;border:none;color:var(--fg);font-family:"Space Mono",monospace;font-size:.875rem;padding:.3rem .5rem;cursor:pointer;text-align:left}
    #search-suggestions .sugg:hover,#search-suggestions .sugg.active{background:var(--nord8);color:#000}

  </style>
</head>
<body>
  <main>
    <div class="card">
      <nav class="nav">
        <div class="nav-links">
          <a href="/" class="$page.custom.get('tab').eql('home').then('active')">gif maker</a>
          <a href="/gallery/" class="$page.custom.get('tab').eql('gallery').then('active')">gallery</a>
        </div>
        <div class="nav-auth">
          <span id="auth-status" style="display:none"></span>
          <button id="btn-login" class="btn btn-small" style="display:none">[ login ]</button>
          <button id="btn-logout" class="btn btn-small" style="display:none">[ logout ]</button>
        </div>
      </nav>
      <div class="card-header">
        <div class="header-info">
          <span class="user">gif.sccl.cc</span>
          <p class="bio">minimal client-side gif maker</p>
        </div>
      </div>
      <div class="card-content">
        <div :html="$page.content()"></div>
      </div>
      <div class="card-footer">
        <span :text="$page.custom.get('tab').suffix('.smd')"></span>
        <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
          <a href="https://git.sccl.cc/scclie/gif.sccl" class="zine-credit" target="_blank">source</a>
          <span class="zine-credit" style="font-size:0.65rem;opacity:.7">COMMIT_HASH</span>
          <a href="https://zine-ssg.io" class="zine-credit" target="_blank">built with zig zine</a>
        </div>
        <a href="https://sccl.cc" class="symbol" target="_blank" style="text-decoration:none">sccl.cc</a>
      </div>
    </div>
  </main>

  <script>window.BUILD_SHA="COMMIT_HASH";</script>
  <script>
    (function () {
      var a = document.getElementById("auth-status");
      var b = document.getElementById("btn-login");
      var c = document.getElementById("btn-logout");
      function showLoggedOut() {
        a.style.display = "none";
        a.innerHTML = "";
        b.style.display = "inline-block";
        c.style.display = "none";
      }
      function showUser(u, ad) {
        a.style.display = "flex";
        var avatar = "";
        if (u.discord_id && u.avatar) {
          avatar =
            '<img class="avatar" src="https://cdn.discordapp.com/avatars/' +
            u.discord_id +
            "/" +
            u.avatar +
            '.png" alt="">';
        }
        a.innerHTML =
          avatar +
          u.username +
          (ad ? ' <span style="color:var(--nord11)">(admin)</span>' : "");
        b.style.display = "none";
        c.style.display = "inline-block";
      }
      c.addEventListener("click", function () {
        fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" })
          .then(function () {
            showLoggedOut();
            window.dispatchEvent(
              new CustomEvent("gif-auth", { detail: null }),
            );
          })
          .catch(function () {
            showLoggedOut();
            window.dispatchEvent(
              new CustomEvent("gif-auth", { detail: null }),
            );
          });
      });
      b.addEventListener("click", function () {
        window.location.href = "/login";
      });
      fetch("/api/auth/me", { credentials: "same-origin" })
        .then(function (r) {
          return r.json();
        })
        .then(function (d) {
          if (d.user) {
            showUser(d.user, d.admin);
            window.dispatchEvent(
              new CustomEvent("gif-auth", {
                detail: { user: d.user, admin: d.admin },
              }),
            );
          } else {
            showLoggedOut();
            window.dispatchEvent(new CustomEvent("gif-auth", { detail: null }));
          }
        })
        .catch(function () {
          showLoggedOut();
        });
    })();
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=turnstileLoaded" async defer></script>
</body>
</html>
